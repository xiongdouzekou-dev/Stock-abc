name: Stock Alert Bot

on:
  schedule:
    # 月〜金の指定した時間(UTC)に自動実行されます
    - cron: '30 23 * * 1-5' # 日本株 開場前 (日本時間 08:30)
    - cron: '30 6 * * 1-5'  # 日本株 閉場後 (日本時間 15:30)
    - cron: '0 13 * * 1-5'  # 米国株 開場前 (日本時間 22:00)
    - cron: '30 21 * * 1-5' # 米国株 閉場後 (日本時間 06:30)
  workflow_dispatch: # 手動で今すぐ実行するための設定

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのデータを読み込む
      uses: actions/checkout@v3

    - name: Pythonの準備
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 必要なツールのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: プログラムの実行（Discordへ通知）
      env:
        WEBHOOK: ${{ secrets.WEBHOOK }}
      run: |
        python stock_alert.py
